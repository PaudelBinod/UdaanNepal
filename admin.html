<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Udaan Nepal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191D; --bg-deep:#101216; --card:#22262C; --card-hover:#2A2F36;
  --electric:#0066FF; --cyan:#00E5FF; --amber:#F59E0B; --red:#F04452; --green:#22C55E;
  --text:#F8FAFC; --text2:#CBD5E1; --muted:#94A3B8;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16); --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;min-height:100dvh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;letter-spacing:-0.01em;}
a{color:var(--cyan);text-decoration:none;}
button,input,select,textarea{font-family:inherit;font-size:14px;}
button{cursor:pointer;}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(16,18,22,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.brand{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;flex:1;min-width:0;}
.brand small{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top a.btn-ghost,.top button.btn-ghost{font-size:13px;font-weight:700;color:var(--text2);padding:9px 12px;border:1px solid var(--border2);border-radius:10px;background:none;min-height:40px;display:inline-flex;align-items:center;}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:10px 16px;border-radius:100px;border:1px solid var(--border2);background:none;color:var(--text2);font-weight:700;font-size:13.5px;min-height:42px;display:flex;align-items:center;gap:8px;}
.tab.on{background:var(--electric);border-color:var(--electric);color:#fff;}
.badge{background:var(--amber);color:#111;border-radius:100px;font-size:11px;font-weight:800;padding:1px 7px;min-width:20px;text-align:center;}

main{max-width:1100px;margin:0 auto;padding:20px 16px 80px;}
h2.title{font-size:20px;margin-bottom:4px;}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.card.tap{cursor:pointer;transition:border-color .2s,transform .2s;}
.card.tap:hover{border-color:rgba(0,229,255,.35);transform:translateY(-2px);}
.stat{font-family:'Poppins',sans-serif;font-size:34px;font-weight:700;line-height:1.1;}
.stat-l{color:var(--text2);font-size:13px;font-weight:600;margin-top:4px;}
.stat-h{color:var(--muted);font-size:12px;margin-top:6px;}
.hot .stat{color:var(--amber);}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:13px;font-weight:700;min-height:38px;}
.chip.on{background:var(--electric);border-color:var(--electric);color:#fff;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar input[type=search]{flex:1;min-width:180px;}

input[type=text],input[type=search],input[type=number],input[type=email],select,textarea{width:100%;background:var(--bg-deep);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:11px 12px;min-height:44px;}
textarea{min-height:90px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--electric);outline-offset:1px;}
label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.field{margin-bottom:14px;}

.btn{border:1px solid var(--border2);background:none;color:var(--text);border-radius:10px;padding:11px 16px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn.primary{background:var(--electric);border-color:var(--electric);color:#fff;}
.btn.good{background:var(--green);border-color:var(--green);color:#06260F;}
.btn.bad{border-color:rgba(240,68,82,.6);color:#FF8A94;}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;}

.item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.item .main{flex:1;min-width:200px;}
.item h4{font-size:15px;margin-bottom:2px;word-break:break-word;}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px 14px;flex-wrap:wrap;}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:100px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap;}
.pill.amber{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1);}
.pill.blue{color:#6FA8FF;border-color:rgba(0,102,255,.4);background:rgba(0,102,255,.12);}
.pill.green{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);}
.pill.red{color:#FF8A94;border-color:rgba(240,68,82,.45);background:rgba(240,68,82,.1);}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--r);}
.note{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.22);color:var(--text2);}
.note.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,9,11,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.sheet{background:var(--card);border:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;padding:22px 18px 28px;}
.sheet h3{font-size:18px;margin-bottom:4px;padding-right:40px;}
.sheet .x{position:absolute;right:14px;top:14px;}
.sheet-wrap{position:relative;}
@media(min-width:700px){.ov{align-items:center;padding:20px;}.sheet{border-radius:18px;}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;margin:12px 0;}
.kv dt{color:var(--muted);font-weight:700;}
.kv dd{color:var(--text);word-break:break-word;white-space:pre-wrap;}
.lesson{padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.lesson:last-child{border:none;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B3B1E;border:1px solid var(--green);color:#D1FAE5;padding:11px 18px;border-radius:12px;z-index:200;font-weight:700;font-size:13.5px;max-width:90vw;}
.toast.err{background:#3B0B12;border-color:var(--red);color:#FFD6DA;}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px;}
.qr{max-width:220px;border-radius:12px;background:#fff;padding:8px;}
.rolechip{display:inline-flex;align-items:center;gap:6px;margin:3px 6px 3px 0;}
.rolechip button{background:none;border:none;color:#FF8A94;font-size:16px;line-height:1;padding:0 2px;min-height:24px;}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Udaan Nepal Admin<small id="who">Loading…</small></div>
    <a class="btn-ghost" href="index.html">← Site</a>
    <button class="btn-ghost" id="logout">Log out</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="panel"><div class="center"><p class="sub">Loading…</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="legal-defaults.js"></script>
<script src="page-text.js"></script>
<script>
const sb = supabase.createClient(
  'https://idwbxagsxpkkqwfjftox.supabase.co',
  'sb_publishable_ju3GQ5lGipjlLtDRZZXxPg__J7tzqfw'
);

/* ---------- tiny helpers (everything is built with textContent, never raw HTML) ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const $ = id => document.getElementById(id);
const rs = n => Number(n) > 0 ? 'Rs ' + Number(n).toLocaleString('en-IN') : 'Free';
const when = t => t ? new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kathmandu'}) : '—';
function toast(msg, bad){
  const t = h('div',{class:'toast'+(bad?' err':'')}, msg); document.body.append(t);
  setTimeout(()=>t.remove(), bad?5000:2500);
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

/* modal sheet */
function openSheet(title, bodyNodes){
  const ov = h('div',{class:'ov'});
  const close = ()=>{ ov.remove(); document.body.style.overflow=''; };
  const sheet = h('div',{class:'sheet'},
    h('div',{class:'sheet-wrap'}, h('button',{class:'btn sm x',onclick:close,'aria-label':'Close'},'✕'), h('h3',{},title)),
    bodyNodes);
  ov.append(sheet);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  document.body.append(ov); document.body.style.overflow='hidden';
  return close;
}
function askText(title, label, required, okLabel){
  return new Promise(resolve=>{
    const ta = h('textarea',{id:'askTa'});
    const err = h('p',{class:'sub',style:'color:#FF8A94;margin:0 0 10px;min-height:18px;'});
    let close;
    const ok = h('button',{class:'btn primary',onclick:()=>{
      const v = ta.value.trim();
      if(required && !v){ err.textContent='Please write something here.'; return; }
      close(); resolve(v);
    }}, okLabel||'Save');
    const cancel = h('button',{class:'btn',onclick:()=>{ close(); resolve(null); }},'Cancel');
    close = openSheet(title, [h('div',{class:'field'}, h('label',{for:'askTa'},label), ta), err, h('div',{class:'row'},ok,cancel)]);
    setTimeout(()=>ta.focus(),50);
  });
}
function confirmBox(title, text, okLabel, danger){
  return new Promise(resolve=>{
    let close;
    const ok = h('button',{class:'btn '+(danger?'bad':'primary'),onclick:()=>{ close(); resolve(true); }}, okLabel||'Yes');
    const cancel = h('button',{class:'btn',onclick:()=>{ close(); resolve(false); }},'Cancel');
    close = openSheet(title, [h('p',{class:'sub',style:'margin-top:8px;'},text), h('div',{class:'row'},ok,cancel)]);
  });
}
async function busy(btn, fn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…';
  try{ await fn(); } finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- state ---------- */
let me = null, roles = new Set(), myName = '';
const can = r => roles.has('super_admin') || roles.has(r);
const ROLE_LABEL = { super_admin:'Super admin', finance:'Finance', academic:'Academic', content:'Content', front_desk:'Front desk' };
let current = 'overview';

const TABS = [
  { id:'overview',  label:'Overview',      show:()=>true },
  { id:'courses',   label:'Courses',       show:()=>can('academic'), badge:'pendCourses' },
  { id:'payments',  label:'Payments',      show:()=>can('finance'),  badge:'pendPayments' },
  { id:'regs',      label:'Registrations', show:()=>can('front_desk'), badge:'newRegs' },
  { id:'users',     label:'Users',         show:()=>can('academic'), badge:'pendTeachers' },
  { id:'categories',label:'Categories',    show:()=>can('academic') },
  { id:'notices',   label:'Notices',       show:()=>can('content') },
  { id:'studio',    label:'Studio',        show:()=>can('finance')||can('content')||can('front_desk') },
  { id:'content',   label:'Site content',  show:()=>can('content') },
  { id:'settings',  label:'Payment details', show:()=>can('finance') || can('content') },
  { id:'media',     label:'Pictures',      show:()=>can('content') },
  { id:'coupons',   label:'Coupons',       show:()=>can('finance')||can('academic') },
  { id:'messages',  label:'Messages',      show:()=>can('front_desk')||can('super_admin'), badge:'newMessages' },
  { id:'certificates',label:'Certificates',show:()=>can('academic') },
  { id:'earnings',   label:'Earnings',      show:()=>can('finance')||can('super_admin') },
  { id:'reports',   label:'Reports',       show:()=>can('front_desk')||can('finance')||can('academic') },
  { id:'staff',     label:'Staff',         show:()=>can('super_admin') },
  { id:'activity',  label:'Activity log',  show:()=>can('super_admin') }
];
const badges = {};

function drawTabs(){
  const box = $('tabs'); clear(box);
  TABS.filter(t=>t.show()).forEach(t=>{
    const n = badges[t.badge];
    box.append(h('button',{class:'tab'+(current===t.id?' on':''),onclick:()=>go(t.id)}, t.label, n>0 ? h('span',{class:'badge'},n) : null));
  });
}
function go(id){ current = id; drawTabs(); render(); window.scrollTo(0,0); }
async function render(){
  const p = $('panel'); clear(p); p.append(h('p',{class:'sub'},'Loading…'));
  const fn = { overview:viewOverview, courses:viewCourses, payments:viewPayments, regs:viewRegs, users:viewUsers, reports:viewReports, categories:viewCategories, media:viewMedia, activity:viewActivity, notices:viewNotices, studio:viewStudio, content:viewContent, settings:viewSettings, staff:viewStaff, coupons:viewCoupons, messages:viewMessages, certificates:viewCertificates, earnings:viewTeacherEarnings }[current];
  try{ const node = await fn(); clear(p); p.append(node); }
  catch(e){ clear(p); p.append(h('div',{class:'note warn'},'Something went wrong: ' + (e && e.message ? e.message : e))); }
}

/* ---------- counts ---------- */
const FORMS = [
  { key:'studio_bookings',     label:'Studio bookings' },
  { key:'unsmp_registrations', label:'UNSMP' },
  { key:'practify_inquiries',  label:'Practify' },
  { key:'unif_registrations',  label:'UNIF' },
  { key:'contact_messages',    label:'Messages' }
];
async function count(table, filter){
  let q = sb.from(table).select('id',{count:'exact',head:true});
  if(filter) q = filter(q);
  const { count:c, error } = await q;
  return error ? 0 : (c||0);
}
async function refreshBadges(){
  if(can('academic')) badges.pendCourses = await count('courses', q=>q.eq('status','pending_review'));
  if(can('academic')) badges.pendTeachers = await count('profiles', q=>q.eq('role','teacher').eq('approval','pending'));
  if(can('finance'))  badges.pendPayments = await count('payments', q=>q.eq('status','submitted'));
  if(can('front_desk')||can('super_admin')) badges.newMessages = await count('contact_messages', q=>q.eq('status','new'));
  if(can('front_desk')){
    const c = await Promise.all(FORMS.map(f=>count(f.key, q=>q.eq('status','new'))));
    badges.newRegs = c.reduce((a,b)=>a+b,0); badges.perForm = c;
  }
  drawTabs();
}

/* ======================= OVERVIEW ======================= */
async function viewOverview(){
  await refreshBadges();
  const wrap = h('div');
  wrap.append(h('h2',{class:'title'},'Hello, ' + (myName || 'team')), h('p',{class:'sub'},'Your access: ' + [...roles].map(r=>ROLE_LABEL[r]).join(', ') + '. Tap a card to open it.'));
  const g = h('div',{class:'grid'});
  const card = (n,l,hint,tab,hot)=> h('div',{class:'card tap'+(hot&&n>0?' hot':''),onclick:()=>go(tab)}, h('div',{class:'stat'},n), h('div',{class:'stat-l'},l), h('div',{class:'stat-h'},hint));
  if(can('academic')) g.append(card(badges.pendCourses,'Courses waiting for review','Teachers are waiting for you','courses',true));
  if(can('finance'))  g.append(card(badges.pendPayments,'Payments to check','Check eSewa / Khalti / bank first','payments',true));
  if(can('front_desk')) FORMS.forEach((f,i)=> g.append(card(badges.perForm[i], 'New ' + f.label, 'Not contacted yet','regs',true)));
  if(can('academic') || can('finance')){
    const act = await count('enrollments', q=>q.eq('status','active'));
    g.append(h('div',{class:'card'}, h('div',{class:'stat'},act), h('div',{class:'stat-l'},'Active enrolments'), h('div',{class:'stat-h'},'Students with course access')));
  }
  if(can('academic')){
    const pub = await count('courses', q=>q.eq('status','published'));
    g.append(h('div',{class:'card'}, h('div',{class:'stat'},pub), h('div',{class:'stat-l'},'Published courses'), h('div',{class:'stat-h'},'Visible to students')));
  }
  wrap.append(g);

  // Quick actions
  if(can('academic') || can('content')){
    const qa = h('div',{class:'card',style:'margin:18px 0 0;'});
    qa.append(h('h4',{style:'margin-bottom:8px;'},'Quick actions'));
    if(can('academic')){
      qa.append(h('button',{class:'btn',style:'margin-right:8px;margin-bottom:8px;',onclick:async e=>{
        await busy(e.currentTarget, async()=>{ await bulkAnnouncement(); });
      }},'📢 Send announcement to all students'));
    }
    wrap.append(qa);
  }

  wrap.append(h('h3',{style:'margin:22px 0 10px;'},'Numbers'), await dashboardNumbers());
  return wrap;
}

/* ======================= COURSES ======================= */
let courseFilter = 'pending_review';
const C_STATUS = { draft:['Draft',''], pending_review:['In review','blue'], published:['Published','green'], rejected:['Sent back','red'] };
async function viewCourses(){
  const wrap = h('div', {}, h('h2',{class:'title'},'Course review'), h('p',{class:'sub'},'Check quality, then publish or send back with a note. Teachers cannot publish by themselves.'));
  const chips = h('div',{class:'chips'});
  [['pending_review','In review'],['published','Published'],['rejected','Sent back'],['draft','Drafts'],['all','All']].forEach(([k,l])=>
    chips.append(h('button',{class:'chip'+(courseFilter===k?' on':''),onclick:()=>{ courseFilter=k; render(); }}, l)));
  wrap.append(chips);

  let q = sb.from('courses').select('*').order('created_at',{ascending:false}).limit(300);
  if(courseFilter!=='all') q = q.eq('status',courseFilter);
  const { data: courses, error } = await q; if(error) throw error;
  if(!courses.length){ wrap.append(h('div',{class:'empty'},'Nothing here.')); return wrap; }
  const ids = courses.map(c=>c.id);
  const [{data:profs},{data:les}] = await Promise.all([
    sb.from('profiles').select('id,full_name').in('id',[...new Set(courses.map(c=>c.instructor_id))]),
    sb.from('lessons').select('course_id').in('course_id',ids)
  ]);
  const name = {}; (profs||[]).forEach(p=>name[p.id]=p.full_name);
  const lc = {}; (les||[]).forEach(l=>lc[l.course_id]=(lc[l.course_id]||0)+1);
  courses.forEach(c=>{
    const st = C_STATUS[c.status] || [c.status,''];
    wrap.append(h('div',{class:'item'},
      h('div',{class:'main'}, h('h4',{},c.title),
        h('div',{class:'meta'}, h('span',{},'By ' + (name[c.instructor_id]||'Unknown')), h('span',{},(lc[c.id]||0)+' lessons'), h('span',{},rs(c.price_npr)), h('span',{},when(c.created_at)))),
      h('span',{class:'pill '+st[1]},st[0]),
      h('button',{class:'btn sm primary',onclick:()=>openCourse(c, name[c.instructor_id])}, c.status==='pending_review'?'Review':'Open')));
  });
  return wrap;
}
async function openCourse(c, teacher){
  const [{data:lessons},{data:mats},{data:coRows}] = await Promise.all([
    sb.from('lessons').select('id,title,video_url,duration_minutes,order_index').eq('course_id',c.id).order('order_index'),
    sb.from('materials').select('file_name').eq('course_id',c.id),
    sb.from('course_instructors').select('user_id,role').eq('course_id',c.id)
  ]);

  // Build co-instructor section (live-refreshable)
  const coSection = h('div',{style:'margin-top:18px;'});
  async function renderCoInstructors(){
    const { data: coList } = await sb.from('course_instructors').select('user_id,role').eq('course_id',c.id);
    const ids = (coList||[]).map(r=>r.user_id).filter(Boolean);
    let coProfs = [];
    if(ids.length){
      const { data } = await sb.from('profiles').select('id,full_name').in('id',ids);
      coProfs = data||[];
    }
    const nameMap = {}; coProfs.forEach(p=>nameMap[p.id]=p.full_name);
    coSection.textContent = '';
    coSection.append(h('h4',{style:'margin:0 0 8px;font-size:13px;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;'},'Co-instructors'));
    if(!(coList||[]).length){
      coSection.append(h('div',{class:'meta',style:'margin-bottom:8px;'},'None added yet.'));
    } else {
      (coList||[]).forEach(row=>{
        const nm = nameMap[row.user_id] || '(unknown)';
        const del = h('button',{class:'btn sm bad',style:'padding:3px 10px;font-size:11px;',onclick:async e=>{
          if(!await confirmBox('Remove co-instructor','Remove '+nm+' as co-instructor?','Remove',true)) return;

let formIdx = 0, regStatus = 'all', regSearch = '';
const R_STATUS = ['new','contacted','confirmed','completed','rejected','cancelled'];
const R_PILL = { new:'amber', contacted:'blue', confirmed:'green', completed:'green', rejected:'red', cancelled:'red' };
const HIDE = new Set(['id','user_id','staff_note','verification_file']);
const nice = k => k.replace(/_/g,' ').replace(/^./,m=>m.toUpperCase());
const titleOf = (r)=> r.full_name || r.contact_person || r.school_name || r.ref || 'Message';
const subOf = (r)=> [r.phone || r.email, r.school || r.school_name || r.org_name, r.subject, r.booking_date, r.mode].filter(Boolean).join(' · ');
let regRows = [];
async function viewRegs(){
  const wrap = h('div',{}, h('h2',{class:'title'},'Registrations & bookings'), h('p',{class:'sub'},'Everything people send through the website forms. Call them, then update the status so nothing is missed.'));
  const tabs = h('div',{class:'chips'});
  FORMS.forEach((f,i)=> tabs.append(h('button',{class:'chip'+(formIdx===i?' on':''),onclick:()=>{ formIdx=i; regStatus='all'; render(); }}, f.label, (badges.perForm&&badges.perForm[i]>0)?' ('+badges.perForm[i]+')':'')));
  wrap.append(tabs);
  const f = FORMS[formIdx];
  const { data, error } = await sb.from(f.key).select('*').order('created_at',{ascending:false}).limit(500);
  if(error) throw error;
  regRows = data;
  const st = h('div',{class:'chips'});
  ['all',...R_STATUS].forEach(s=> st.append(h('button',{class:'chip'+(regStatus===s?' on':''),onclick:()=>{ regStatus=s; paint(); markChips(); }}, s==='all'?'All':nice(s))));
  const search = h('input',{type:'search',placeholder:'Search name, phone, school, ref…',value:regSearch});
  const exportBtn = h('button',{class:'btn sm',onclick:()=>exportCsv(f)},'Download CSV');
  wrap.append(h('div',{class:'toolbar'},search,exportBtn), st);
  const list = h('div');
  wrap.append(list);
  function markChips(){ [...st.children].forEach((b,i)=> b.classList.toggle('on', (['all',...R_STATUS][i])===regStatus)); }
  function filtered(){
    const s = regSearch.trim().toLowerCase();
    return regRows.filter(r=> (regStatus==='all' || r.status===regStatus) && (!s || JSON.stringify(Object.values(r)).toLowerCase().includes(s)));
  }
  function paint(){
    clear(list); const rows = filtered();
    if(!rows.length){ list.append(h('div',{class:'empty'}, regRows.length ? 'No match.' : 'Nothing has been sent yet.')); return; }
    rows.forEach(r=> list.append(h('div',{class:'item'},
      h('div',{class:'main'}, h('h4',{},titleOf(r)), h('div',{class:'meta'}, r.ref ? h('span',{},r.ref) : null, subOf(r)?h('span',{},subOf(r)):null, h('span',{},when(r.created_at)))),
      h('span',{class:'pill '+(R_PILL[r.status]||'')},nice(r.status)),
      h('button',{class:'btn sm primary',onclick:()=>openReg(f,r,paint)},'Open'))));
  }
  search.addEventListener('input', ()=>{ regSearch = search.value; paint(); });
  paint();
  return wrap;
}
function exportCsv(f){
  const rows = regRows; if(!rows.length){ toast('Nothing to download',true); return; }
  const cols = Object.keys(rows[0]).filter(k=>!['id','user_id'].includes(k));
  const cell = v => { if(v==null) return ''; const s = Array.isArray(v) ? v.join('; ') : String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = '﻿' + [cols.join(','), ...rows.map(r=>cols.map(c=>cell(r[c])).join(','))].join('\n');
  const a = h('a',{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),download:f.key+'-'+new Date().toISOString().slice(0,10)+'.csv'});
  document.body.append(a); a.click(); a.remove();
}
function openReg(f, r, repaint){
  const kv = h('dl',{class:'kv'});
  Object.keys(r).filter(k=>!HIDE.has(k) && r[k]!=null && r[k]!=='' && !(Array.isArray(r[k])&&!r[k].length)).forEach(k=>{
    let v = r[k]; if(Array.isArray(v)) v = v.join(', '); if(k==='created_at') v = when(v);
    const dd = h('dd',{}, v);
    if((k==='phone'||k==='mentor_phone'||k==='parent_phone') ) { clear(dd); dd.append(h('a',{href:'tel:'+r[k]},r[k])); }
    if(k==='email') { clear(dd); dd.append(h('a',{href:'mailto:'+r[k]},r[k])); }
    kv.append(h('dt',{},nice(k)), dd);
  });
  const sel = h('select',{id:'rstat'}, R_STATUS.map(s=>h('option',{value:s,selected:s===r.status},nice(s))));
  const note = h('textarea',{id:'rnote',placeholder:'e.g. Called on Sunday, will pay on arrival'}, r.staff_note||'');
  let close;
  const body = [kv];
  if(r.verification_file){
    body.push(h('button',{class:'btn sm',style:'margin-bottom:12px;',onclick:async()=>{
      const w = window.open('','_blank');
      const {data,error} = await sb.storage.from('booking-verification').createSignedUrl(r.verification_file,300);
      if(error){ if(w) w.close(); toast('Could not open file: '+error.message,true); return; }
      if(w) w.location.href = data.signedUrl; else window.location.href = data.signedUrl;
    }},'View uploaded ID file'));
  }
  let priceIn = null;
  if(f.key==='studio_bookings'){
    priceIn = h('input',{type:'number',id:'rprice',min:'0',value:r.final_price_npr==null?'':r.final_price_npr,placeholder:'Confirmed price in Rs'});
    body.push(h('div',{class:'field'}, h('label',{for:'rprice'},'Final price (Rs) — what you confirmed with the customer'), priceIn));
  }
  body.push(
    h('div',{class:'field'}, h('label',{for:'rstat'},'Status'), sel),
    h('div',{class:'field'}, h('label',{for:'rnote'},'Internal note (only staff see this)'), note),
    h('button',{class:'btn primary',onclick:async e=>{
      await busy(e.currentTarget, async()=>{
        const patch = { status: sel.value, staff_note: note.value.trim() || null };
        if(priceIn) patch.final_price_npr = priceIn.value === '' ? null : Number(priceIn.value);
        const {error} = await sb.from(f.key).update(patch).eq('id',r.id);
        if(error){ toast('Could not save: '+error.message,true); return; }
        Object.assign(r, patch); close(); toast('Saved'); repaint(); refreshBadges();
      });
    }},'Save'));
  close = openSheet(titleOf(r), body);
}

let userFilter = 'all', userSearch = '';
async function viewUsers(){
  const wrap = h('div',{}, h('h2',{class:'title'},'Users'), h('p',{class:'sub'},'Everyone who has signed up. New teachers must be approved before they can create courses.'));
  const { data, error } = await sb.rpc('admin_user_list');
  if(error){ wrap.append(h('div',{class:'note warn'},'Could not load: '+error.message+' (did you run 8_users_and_teachers.sql?)')); return wrap; }
  const all = data||[];
  const pend = all.filter(u=>u.role==='teacher' && u.approval==='pending').length;
  const chips = h('div',{class:'chips'});
  [['all','All'],['pending','Waiting for approval'+(pend?' ('+pend+')':'')],['teacher','Teachers'],['student','Students'],['parent','Parents']].forEach(([k,l])=>
    chips.append(h('button',{class:'chip'+(userFilter===k?' on':''),onclick:()=>{ userFilter=k; paint(); chips.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',['all','pending','teacher','student','parent'][i]===k)); }},l)));
  const search = h('input',{type:'search',placeholder:'Search name, email or phone',value:userSearch,style:'margin:10px 0;',oninput:e=>{ userSearch=e.target.value; paint(); }});
  const list = h('div');
  if(can('academic')) wrap.append(await invitesCard());
  wrap.append(chips, search, list);

  /* ── open per-user management sheet ── */
  async function manageUser(u){
    const name = u.full_name || '(no name)';
    const isDeactivated = u.is_active === false;

    // Load enrollments if student
    let enrollRows = [];
    if(u.role === 'student'){
      const { data: enrs } = await sb.from('enrollments')
        .select('id, course_id, courses(title)')
        .eq('student_id', u.user_id)
        .neq('status','removed');
      enrollRows = enrs || [];
    }

    const enrollSection = u.role === 'student' ? (()=>{
      const sec = h('div',{style:'margin-bottom:16px;'});
      sec.append(h('div',{class:'sub',style:'font-weight:700;margin-bottom:6px;'},'Enrolled courses'));
      if(!enrollRows.length){
        sec.append(h('p',{class:'sub'},'Not enrolled in any course.'));
      } else {
        enrollRows.forEach(enr=>{
          const title = (enr.courses && enr.courses.title) || 'Untitled course';
          const row = h('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border2);gap:10px;'});
          const unenrollBtn = h('button',{class:'btn sm bad',onclick:async e=>{ await busy(e.currentTarget, async()=>{
            if(!await confirmBox('Remove from course?', name+' will lose access to "'+title+'" immediately. No refund is triggered.','Remove',true)) return;
            const { error } = await sb.from('enrollments').update({status:'removed'}).eq('id',enr.id);
            if(error){ toast('Could not remove: '+error.message,true); return; }
            toast('Removed from '+title);
            enrollRows = enrollRows.filter(r=>r.id!==enr.id);
            row.remove();
          }); }},'Remove');
          row.append(h('span',{},title), unenrollBtn);
          sec.append(row);
        });
      }
      return sec;
    })() : null;

    const deactivateBtn = h('button',{class:'btn '+(isDeactivated?'primary':''),style:isDeactivated?'':'border:1px solid var(--amber);color:var(--amber);',
      onclick:async e=>{ await busy(e.currentTarget, async()=>{
        const newState = !isDeactivated;
        const msg = newState ? 'Deactivate '+name+'?\n\nThey will not be able to log in. Their records and course history are kept. You can re-activate them any time.' : 'Re-activate '+name+'?';
        const label = newState ? 'Deactivate' : 'Re-activate';
        if(!await confirmBox(label, msg, label, newState)) return;
        const { error } = await sb.from('profiles').update({is_active: !newState}).eq('id',u.user_id);
        if(error){ toast('Could not update: '+error.message,true); return; }
        u.is_active = !newState;
        toast(newState ? name+' deactivated' : name+' re-activated');
        closeSheet(); paint();
      }); }}, isDeactivated ? '✓ Re-activate account' : 'Deactivate account');

    const deleteBtn = h('button',{class:'btn bad',onclick:async e=>{ await busy(e.currentTarget, async()=>{
      if(!await confirmBox('Permanently delete account?',
        '⚠️ This cannot be undone.\n\n'+name+'\'s account, login credentials and profile will be permanently removed. Payment records and enrollment history that reference this account may also be affected.\n\nIf you only want to block access, use Deactivate instead.',
        'Delete permanently', true)) return;
      // Double confirm for hard delete
      if(!await confirmBox('Are you absolutely sure?','Type-check: you are about to permanently delete '+name+' ('+u.email+'). This action is irreversible.','Yes, delete permanently',true)) return;
      const { error } = await sb.rpc('admin_delete_user', { p_user: u.user_id });
      if(error){ toast('Could not delete: '+error.message,true); return; }
      toast(name+' deleted');
      closeSheet();
      all.splice(all.findIndex(x=>x.user_id===u.user_id),1);
      paint();
    }); }},'Delete account permanently');

    const divider = h('hr',{style:'border:none;border-top:1px solid var(--border2);margin:16px 0;'});
    const dangerLabel = h('div',{class:'sub',style:'font-weight:700;margin-bottom:8px;color:#FF8A94;'},'⚠️ Danger zone');
    const nodes = enrollSection
      ? [enrollSection, divider, dangerLabel, h('div',{class:'row'},deactivateBtn,deleteBtn)]
      : [divider, dangerLabel, h('div',{class:'row'},deactivateBtn,deleteBtn)];
    closeSheet = openSheet('Manage: '+name, nodes);
  }
  let closeSheet = ()=>{};

  function paint(){
    clear(list);
    const q = userSearch.trim().toLowerCase();
    const rows = all.filter(u=>{
      if(userFilter==='pending' && !(u.role==='teacher' && u.approval==='pending')) return false;
      if(['teacher','student','parent'].includes(userFilter) && u.role!==userFilter) return false;
      return !q || [u.full_name,u.email,u.phone].join(' ').toLowerCase().includes(q);
    });
    if(!rows.length) list.append(h('p',{class:'sub'},'Nobody matches.'));
    rows.slice(0,200).forEach(u=>{
      const isDeactivated = u.is_active === false;
      const row = h('div',{class:'item',style:isDeactivated?'opacity:0.55;':''},
        h('div',{}, h('h4',{}, u.full_name || '(no name)', isDeactivated ? h('span',{style:'font-size:11px;color:var(--amber);margin-left:8px;font-weight:700;'},'DEACTIVATED'):''),
          h('p',{class:'sub',style:'margin:2px 0;'}, nice(u.role)+(u.role==='teacher' ? ' · '+nice(u.approval) : '')+' · ', h('a',{href:'mailto:'+u.email},u.email), u.phone?' · '+u.phone:'', u.school?' · '+u.school:'')));
      if(u.role==='teacher' && can('academic')){
        const set = async (st, e) => { await busy(e.currentTarget, async()=>{
          const { error } = await sb.rpc('admin_set_approval',{ p_user:u.user_id, p_status:st });
          if(error){ toast('Could not save: '+error.message,true); return; }
          u.approval = st; toast(st==='approved'?'Teacher approved':'Teacher '+st); paint(); }); };
        if(u.approval!=='approved') row.append(h('button',{class:'btn sm primary',onclick:e=>set('approved',e)},'Approve'));
        if(u.approval!=='suspended') row.append(h('button',{class:'btn sm bad',onclick:async e=>{ const b=e.currentTarget; if(await confirmBox('Suspend this teacher?','They will not be able to create new courses until approved again.','Suspend',true)) set('suspended',{currentTarget:b}); }},'Suspend'));
      }
      if(can('super_admin') || can('academic')){
        row.append(h('button',{class:'btn sm',onclick:()=>manageUser(u)},'Manage'));
      }
      list.append(row);
    });
  }
  paint();
  return wrap;
}

/* ======================= GENERIC LIST EDITOR (projects, sponsors, photos…) ======================= */
async function uploadImage(file, prefix){
  if(file.size > 2*1024*1024) throw new Error('Picture is larger than 2 MB.');
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
  const path = prefix+'-'+Date.now()+'-'+Math.floor(Math.random()*1000)+'.'+ext;
  const up = await sb.storage.from('site-assets').upload(path, file, { contentType:file.type });
  if(up.error) throw up.error;
  return sb.storage.from('site-assets').getPublicUrl(path).data.publicUrl;
}
/* fields: [key,label,type] with type 'text' | 'area' | 'image' */
async function listCard(title, settingKey, fields, nameKey, help){
  const { data } = await sb.from('site_settings').select('value').eq('key',settingKey).maybeSingle();
  let list = Array.isArray(data && data.value && data.value.list) ? data.value.list.slice() : [];
  const box = h('details',{style:'border:1px solid var(--border);border-radius:12px;padding:0 14px;margin-bottom:10px;'}, h('summary',{style:'cursor:pointer;padding:14px 0;font-weight:700;min-height:44px;'}, title));
  if(help) box.append(h('p',{class:'sub'},help));
  const body = h('div');
  const draw = () => {
    clear(body);
    if(!list.length) body.append(h('p',{class:'sub'},'Nothing added yet.'));
    list.forEach((x,i)=> body.append(h('div',{class:'item',style:'background:var(--bg-deep);'},
      h('div',{}, x[fields.find(f=>f[2]==='image')?.[0]] ? h('img',{src:x[fields.find(f=>f[2]==='image')[0]],alt:'',style:'height:40px;border-radius:6px;margin-right:8px;vertical-align:middle;'}) : null, h('b',{}, x[nameKey] || '(no name)')),
      h('div',{class:'row'},
        h('button',{class:'btn sm',disabled:i===0,onclick:()=>{ list.splice(i-1,0,list.splice(i,1)[0]); draw(); }},'↑'),
        h('button',{class:'btn sm',onclick:()=>edit(i)},'Edit'),
        h('button',{class:'btn sm bad',onclick:()=>{ list.splice(i,1); draw(); }},'Remove')))));
  };
  const edit = (i) => {
    const cur = i==null ? {} : list[i]; const vals = Object.assign({}, cur); const inputs = {}; const nodes = [];
    fields.forEach(([k,l,t])=>{
      if(t==='image'){
        const msg = h('p',{class:'sub',style:'min-height:18px;'}, vals[k] ? 'A picture is set.' : 'No picture yet.');
        const file = h('input',{type:'file',accept:'image/png,image/jpeg,image/webp'});
        file.addEventListener('change', async ()=>{ const f = file.files[0]; if(!f) return; msg.textContent='Uploading…';
          try{ vals[k] = await uploadImage(f, settingKey); msg.textContent='Picture uploaded.'; }catch(e){ msg.textContent='Upload failed: '+(e.message||e); } });
        nodes.push(h('div',{class:'field'}, h('label',{},l+' (under 2 MB)'), file, msg));
      } else { const f = fieldInput('li_'+k,l,t,vals[k]); inputs[k] = f.querySelector('input,textarea'); nodes.push(f); }
    });
    let close;
    nodes.push(h('button',{class:'btn primary',onclick:()=>{
      Object.entries(inputs).forEach(([k,el])=>{ vals[k] = el.value.trim(); });
      if(!vals[nameKey]){ toast('Please fill in the first box',true); return; }
      if(i==null) list.push(vals); else list[i] = vals; close(); draw(); }},'Done'));
    close = openSheet(i==null?'Add':'Edit', nodes);
  };
  box.append(body, h('div',{class:'row',style:'margin-bottom:14px;'},
    h('button',{class:'btn',onclick:()=>edit(null)},'Add one'),
    h('button',{class:'btn primary',onclick:e=>busy(e.currentTarget, async()=>{
      const { error } = await sb.from('site_settings').upsert({ key:settingKey, value:{ list }, updated_by: me.id, updated_at:new Date().toISOString() });
      if(error){ toast('Could not save: '+error.message,true); return; } toast('Saved — the website now shows this'); })},'Save')));
  draw(); return box;
}

async function batchEnrollForm(){
  const { data: cs } = await sb.from('courses').select('id,title,price_npr').eq('status','published').order('title');
  if(!(cs||[]).length){ toast('There are no published courses yet',true); return; }

  const courseEl = h('div',{class:'field'}, h('label',{for:'bc_course'},'Course to enrol into'),
    h('select',{id:'bc_course'}, cs.map(c=>h('option',{value:c.id},c.title+' — '+rs(c.price_npr)))));
  const methodEl = h('div',{class:'field'}, h('label',{for:'bc_method'},'Payment method (for paid courses)'),
    h('select',{id:'bc_method'}, ['cash','esewa','khalti','bank','other'].map(m=>h('option',{value:m},nice(m)))));

  // CSV / paste area
  const pasteEl = h('div',{class:'field'},
    h('label',{},'Student emails — paste one per line, or upload a CSV'),
    h('textarea',{id:'bc_paste',placeholder:'student1@example.com\nstudent2@example.com\n…',style:'min-height:100px;width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#F8FAFC;font-family:Manrope,sans-serif;font-size:13px;padding:10px 12px;resize:vertical;box-sizing:border-box;'})
  );

  // CSV file upload — auto-fills the textarea
  const fileEl = h('div',{class:'field'},
    h('label',{},'Or upload a .csv file (one email per row, first column used)'),
    h('input',{type:'file',accept:'.csv,text/csv'})
  );
  fileEl.querySelector('input').addEventListener('change', ()=>{
    const f = fileEl.querySelector('input').files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split(/\r?\n/).map(l=>l.split(',')[0].replace(/["\s]/g,'').toLowerCase()).filter(Boolean);
      document.getElementById('bc_paste').value = lines.join('\n');
    };
    reader.readAsText(f);
  });

  const resultEl = h('div',{style:'margin-top:10px;font-size:13px;min-height:20px;'});
  let close;

  const go = h('button',{class:'btn primary',onclick:e=>busy(e.currentTarget, async()=>{
    const raw = document.getElementById('bc_paste').value;
    const emails = [...new Set(raw.split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(s=>s.includes('@')))];
    if(!emails.length){ toast('No valid emails found.',true); return; }

    const courseId = document.getElementById('bc_course').value;
    const method   = document.getElementById('bc_method').value;

    resultEl.textContent = 'Working… 0 / '+emails.length;
    let ok=0, skip=0, fail=[];

    for(let i=0; i<emails.length; i++){
      resultEl.textContent = 'Working… '+(i+1)+' / '+emails.length;
      const { error } = await sb.rpc('admin_manual_enroll',{
        p_email: emails[i], p_course: courseId, p_method: method, p_ref:'batch-csv', p_note:'Batch enrolled by admin'
      });
      if(error){
        // "already enrolled" is not a real failure
        if(/already|duplicate|exists/i.test(error.message)) skip++;
        else fail.push(emails[i]+' ('+error.message+')');
      } else { ok++; }
    }

    let summary = ok+' enrolled';
    if(skip) summary += ', '+skip+' already enrolled (skipped)';
    if(fail.length) summary += ', '+fail.length+' failed';
    resultEl.innerHTML = '<b>Done:</b> '+summary+(fail.length ? '<br><span style="color:#FF8A94;font-size:12px;">'+fail.slice(0,5).join('<br>')+(fail.length>5?' …and '+(fail.length-5)+' more':'')+'</span>' : '');
    if(ok>0){ toast(ok+' student'+(ok>1?'s':'')+' enrolled'); render(); }
  })},'Enrol all');

  close = openSheet('Batch enrol from CSV', [
    h('p',{class:'sub',style:'margin-top:8px;'},'Enrol multiple students at once. Each email must belong to an existing account. Already-enrolled students are skipped safely.'),
    courseEl, methodEl, pasteEl, fileEl, go, resultEl
  ]);
}

/* Builds the report: returns [[sheetName, rows(array of arrays)], ...]. Same logic is used by the admin page and the daily email. */
function buildReportSheets(d, label){
  const fmt = t => t ? new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kathmandu'}) : '';
  const j = a => Array.isArray(a) ? a.join(', ') : (a || '');
  const sheets = [];
  const add = (name, head, rows, fn) => {
    const body = (rows||[]).map(fn);
    sheets.push([name, [head].concat(body.length ? body : [[rows===null ? 'Not available for your role' : 'No new records in this period']])]);
    return body.length;
  };
  const n = {};
  n.studio = add('Studio bookings', ['Reference','Received','Name','Phone','Email','Booking type','Organisation','Studio space','Date wanted','Time slot','Duration','People','Purposes','Equipment','Facilities','Special requests','Estimated total (Rs)','Final price (Rs)','Status'],
    d.studio, r => [r.ref,fmt(r.created_at),r.full_name,r.phone,r.email,r.booking_type,r.org_name||'',r.studio_space,r.booking_date,r.time_slot,r.duration,r.people_count,j(r.purposes),j(r.equipment),j(r.facilities),r.special_requests||'',r.estimated_total==null?'':r.estimated_total,r.final_price_npr==null?'':r.final_price_npr,r.status]);
  n.unsmp = add('UNSMP registrations', ['Reference','Received','Name','Phone','Email','Registered as','Type','School','Grade','Designation','Address','Parent name','Parent phone','Student name','No. of students','No. of teachers','No. of parents','Status'],
    d.unsmp, r => [r.ref,fmt(r.created_at),r.full_name,r.phone,r.email||'',r.mode,r.participant_type||'',r.school||'',r.grade||'',r.designation||'',r.address||'',r.parent_name||'',r.parent_phone||'',r.student_name||'',r.num_students||'',r.num_teachers||'',r.num_parents||'',r.status]);
  n.unif = add('UNIF registrations', ['Reference','Received','Name','Phone','Email','Registered as','School','Grade','Designation','Address','Project title','Category','Project summary','Team size','Team members','Mentor','Mentor phone','Special needs','No. of projects','No. of students','No. of teachers','Status'],
    d.unif, r => [r.ref,fmt(r.created_at),r.full_name,r.phone,r.email||'',r.mode,r.school,r.grade||'',r.designation||'',r.address||'',r.project_title||'',(r.categories&&r.categories.length?j(r.categories):r.category)||'',r.project_summary||'',r.team_size||'',r.team_members||'',r.mentor_name||'',r.mentor_phone||'',r.special_needs||'',r.num_projects||'',r.num_students||'',r.num_teachers||'',r.status]);
  n.practify = add('Practify inquiries', ['Reference','Received','School','Location','Contact person','Designation','Phone','Email','Programs','Grade group','No. of students','Duration','Preferred dates','Notes','Status'],
    d.practify, r => [r.ref,fmt(r.created_at),r.school_name,r.school_location,r.contact_person,r.designation,r.phone,r.email,j(r.programs),r.grade_group||'',r.student_count||'',r.duration||'',r.preferred_dates||'',r.notes||'',r.status]);
  const byEmail = {}; (d.users||[]).forEach(u => { byEmail[String(u.email||'').toLowerCase()] = u; });
  n.teachers = add('New teachers', ['Joined','Name','Phone','Email','School','Approval','Invitation note'],
    d.invites, r => { const u = byEmail[String(r.email||'').toLowerCase()] || {}; return [fmt(r.used_at),u.full_name||'',u.phone||'',r.email,u.school||'',u.approval||'',r.note||'']; });
  n.payments = add('Course payments', ['Submitted','Student','Course','Amount (Rs)','Method','Transaction ID','Status','Reviewed','Note','Refund (Rs)'],
    d.payments, r => [fmt(r.submitted_at),r.student_name||'',r.course_title||'',r.amount_npr,r.method,r.transaction_ref||'',r.status,fmt(r.reviewed_at),r.note||'',r.refund_amount_npr==null?'':r.refund_amount_npr]);
  const summary = [['Udaan Nepal report'],[label],[],['What','New records'],
    ['Studio bookings',n.studio],['UNSMP registrations',n.unsmp],['UNIF registrations',n.unif],['Practify inquiries',n.practify],['New teachers',n.teachers],['Course payments',n.payments]];
  return { sheets:[['Summary',summary]].concat(sheets), counts:n };
}

const npDay = () => new Date(Date.now() + 5.75*3600*1000).toISOString().slice(0,10);
async function fetchReportData(from, to){
  const s = new Date(from+'T00:00:00+05:45').toISOString(), e = new Date(new Date(to+'T00:00:00+05:45').getTime()+864e5).toISOString();
  const get = async (tbl,col) => { const { data, error } = await sb.from(tbl).select('*').gte(col,s).lt(col,e).order(col); return error ? null : data; };
  const d = { studio:await get('studio_bookings','created_at'), unsmp:await get('unsmp_registrations','created_at'), unif:await get('unif_registrations','created_at'),
              practify:await get('practify_inquiries','created_at'), payments:await get('payments','submitted_at') };
  const inv = await sb.rpc('admin_invite_list'), usr = await sb.rpc('admin_user_list');
  d.invites = inv.error ? null : (inv.data||[]).filter(i=>i.used_at && i.used_at>=s && i.used_at<e);
  d.users = usr.error ? [] : usr.data;
  return d;
}
async function viewReports(){
  const wrap = h('div',{}, h('h2',{class:'title'},'Reports'), h('p',{class:'sub'},'New studio bookings, UNSMP and UNIF registrations, Practify inquiries, new teachers and course payments for the days you choose. The Excel file has one sheet for each, with phone numbers. A report like this is also emailed to you at 5 pm every day once the daily email is set up.'));
  const from = fieldInput('rp_from','From','date',npDay()), to = fieldInput('rp_to','To','date',npDay());
  const out = h('div',{style:'margin-top:14px;'});
  let last = null, lastLabel = '';
  const run = async (btn) => busy(btn, async()=>{
    const f = from.querySelector('input').value, t = to.querySelector('input').value;
    if(!f || !t || f > t){ toast('Please choose a start date that is not after the end date',true); return; }
    clear(out); out.append(h('p',{class:'sub'},'Loading…'));
    const d = await fetchReportData(f,t);

    last = buildReportSheets(d, lastLabel);
    clear(out);
    const names = {studio:'Studio bookings',unsmp:'UNSMP registrations',unif:'UNIF registrations',practify:'Practify inquiries',teachers:'New teachers',payments:'Course payments'};
    const key = { teachers:'invites' };

    Object.entries(names).forEach(([k,l])=> out.append(h('div',{class:'item'}, h('b',{},l), h('span',{}, d[key[k]||k]===null ? 'not available for your role' : String(last.counts[k])))));
    out.append(h('button',{class:'btn primary',style:'margin-top:12px;',onclick:()=>{
      if(!window.XLSX){ toast('The Excel tool could not load. Check your internet and refresh.',true); return; }
      const wb = XLSX.utils.book_new();
      last.sheets.forEach(([n,rows])=>{ const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = (rows[0]||[]).map(()=>({wch:22})); XLSX.utils.book_append_sheet(wb, ws, n); });
      XLSX.writeFile(wb, 'udaan-report-'+f+(f===t?'':'-to-'+t)+'.xlsx');
    }},'Download Excel file'));
  });
  wrap.append(h('div',{class:'card'}, from, to, h('div',{class:'row'}, h('button',{class:'btn',onclick:e=>{ from.querySelector('input').value = to.querySelector('input').value = npDay(); run(e.currentTarget); }},"Today's report"), h('button',{class:'btn primary',onclick:e=>run(e.currentTarget)},'Show report')), out));
  return wrap;
}

  const wrap = h('div',{}, h('h2',{class:'title'},'Certificates'), h('p',{class:'sub'},'Students who have completed all lessons in a course and earned a certificate.'));
  // lesson_progress + enrollments join: find students who finished all lessons per course
  const { data: courses, error: cErr } = await sb.from('courses').select('id,title').eq('status','published').order('title');
  if(cErr){ wrap.append(h('div',{class:'note warn'},'Could not load courses: '+cErr.message)); return wrap; }
  const courseFilter = h('select',{style:'margin-bottom:14px;max-width:340px;',onchange:()=>paintCerts()},
    h('option',{value:''},'All courses'), (courses||[]).map(c=>h('option',{value:c.id},c.title)));
  const list = h('div');
  async function paintCerts(){
    clear(list); list.append(h('p',{class:'sub'},'Loading…'));
    // Get all lessons counts per course
    let cIds = (courses||[]).map(c=>c.id);
    if(courseFilter.value) cIds = [courseFilter.value];
    const [{ data: lessonCounts }, { data: progRows }, { data: enrRows }] = await Promise.all([
      sb.from('lessons').select('id,course_id').in('course_id',cIds),
      sb.from('lesson_progress').select('student_id,lesson_id'),
      sb.from('enrollments').select('student_id,course_id,profiles(full_name)').in('course_id',cIds).eq('status','active')
    ]);
    const totalPerCourse = {};
    (lessonCounts||[]).forEach(l=>{ totalPerCourse[l.course_id]=(totalPerCourse[l.course_id]||0)+1; });
    // Map lesson_id → course_id
    const lessonToCourse = {};
    (lessonCounts||[]).forEach(l=>{ lessonToCourse[l.id]=l.course_id; });
    // Count done per student per course
    const doneMap = {};
    (progRows||[]).forEach(r=>{
      const cid = lessonToCourse[r.lesson_id]; if(!cid) return;
      const key = r.student_id+'|'+cid;
      doneMap[key]=(doneMap[key]||0)+1;
    });
    // Find completions
    const completions = [];
    (enrRows||[]).forEach(e=>{
      const total = totalPerCourse[e.course_id]||0;
      if(total===0) return;
      const done = doneMap[e.student_id+'|'+e.course_id]||0;
      if(done>=total){
        const course = (courses||[]).find(c=>c.id===e.course_id);
        completions.push({ name:(e.profiles&&e.profiles.full_name)||'(no name)', course:course?course.title:'', done, total });
      }
    });
    clear(list);
    if(!completions.length){ list.append(h('div',{class:'empty'},'No completions yet.')); return; }
    list.append(h('p',{class:'sub',style:'margin-bottom:8px;'},completions.length+' certificate'+(completions.length===1?'':'s')+ ' earned'));
    completions.sort((a,b)=>a.name.localeCompare(b.name)).forEach(cp=>{
      list.append(h('div',{class:'item'},
        h('div',{class:'main'}, h('h4',{},cp.name), h('div',{class:'meta'}, h('span',{},cp.course), h('span',{},'✓ '+cp.done+'/'+cp.total+' lessons'))),
        h('span',{class:'pill green'},'Completed')));
    });
  }
  wrap.append(courseFilter, list);
  await paintCerts();
  return wrap;
}

/* ======================= BULK ANNOUNCEMENT ======================= */
async function bulkAnnouncement(){
  return new Promise(resolve=>{
    const titleIn = h('input',{type:'text',placeholder:'e.g. Holiday notice — office closed Saturday'});
    const bodyIn = h('textarea',{style:'min-height:100px;',placeholder:'Write your message here…'});
    let cz;
    const send = async e=>{ await busy(e.currentTarget, async()=>{
      const title = titleIn.value.trim(), body = bodyIn.value.trim();
      if(!title||!body){ toast('Please fill in both title and message',true); return; }
      const { data:{ user } } = await sb.auth.getUser();
      const { data: pubs } = await sb.from('courses').select('id').eq('status','published');
      if(!(pubs||[]).length){ toast('No published courses found',true); return; }
      let ok=0, fail=0;
      for(const c of (pubs||[])){
        const { error } = await sb.from('course_announcements').insert({ course_id:c.id, author_id:user.id, title, body });
        if(error) fail++; else ok++;
      }
      cz(); resolve();
      toast('Announcement sent to '+ok+' course'+(ok===1?'':'s')+(fail?' ('+fail+' failed)':''));
    }); };
    cz = openSheet('Send announcement to all students',[
      h('div',{class:'note',style:'margin-bottom:14px;'},'This posts to every published course. All enrolled students will see it in their course\'s Announcements tab.'),
      h('div',{class:'field'}, h('label',{},'Title'), titleIn),
      h('div',{class:'field'}, h('label',{},'Message'), bodyIn),
      h('div',{class:'row'},
        h('button',{class:'btn primary',onclick:send},'Send to all courses'),
        h('button',{class:'btn',onclick:()=>{ cz(); resolve(); }},'Cancel'))
    ]);
  });
}

/* ======================= TEACHER EARNINGS ======================= */
async function viewTeacherEarnings(){
  const wrap = h('div',{}, h('h2',{class:'title'},'Teacher earnings'), h('p',{class:'sub'},'Approved payments broken down per course and instructor. Useful for calculating instructor share.'));
  const [{ data: pays, error }, { data: courseList }] = await Promise.all([
    sb.from('payments').select('course_id,course_title,amount_npr').eq('status','approved').order('course_title'),
    sb.from('courses').select('id,title,instructor_id,profiles(full_name)').eq('status','published')
  ]);
  if(error){ wrap.append(h('div',{class:'note warn'},'Could not load: '+error.message)); return wrap; }
  // Build instructor name map from courses
  const instrMap = {};
  (courseList||[]).forEach(c=>{ instrMap[c.id] = (c.profiles&&c.profiles.full_name)||'Udaan Nepal'; });
  // Group payments by course
  const groups = {};
  (pays||[]).forEach(p=>{
    const cid = p.course_id||'unknown';
    if(!groups[cid]) groups[cid]={ title:p.course_title||'Untitled', instructor:instrMap[cid]||'Udaan Nepal', total:0, count:0 };
    groups[cid].total += (p.amount_npr||0);
    groups[cid].count++;
  });
  const rows = Object.values(groups).sort((a,b)=>b.total-a.total);
  if(!rows.length){ wrap.append(h('div',{class:'empty'},'No approved payments yet.')); return wrap; }
  const grandTotal = rows.reduce((s,r)=>s+r.total,0);
  wrap.append(h('div',{class:'note',style:'margin-bottom:14px;'},'Total revenue from approved payments: '+rs(grandTotal)));
  // Group by instructor for summary
  const instrTotals = {};
  rows.forEach(r=>{ instrTotals[r.instructor]=(instrTotals[r.instructor]||0)+r.total; });
  const summaryGrid = h('div',{class:'grid',style:'margin-bottom:18px;'});
  Object.entries(instrTotals).sort((a,b)=>b[1]-a[1]).forEach(([name,total])=>{
    summaryGrid.append(h('div',{class:'card'}, h('div',{class:'stat',style:'font-size:22px;color:var(--green);'},rs(total)), h('div',{class:'stat-l'},name), h('div',{class:'stat-h'},'Total earned')));
  });
  wrap.append(h('h3',{style:'margin:0 0 10px;font-size:15px;'},'By instructor'), summaryGrid);
  wrap.append(h('h3',{style:'margin:0 0 10px;font-size:15px;'},'By course'));
  rows.forEach(r=>{
    wrap.append(h('div',{class:'item'},
      h('div',{class:'main'},
        h('h4',{},r.title),
        h('div',{class:'meta'}, h('span',{},'Instructor: '+r.instructor), h('span',{},r.count+' payment'+(r.count===1?'':'s')))),
      h('span',{style:'font-family:Poppins,sans-serif;font-weight:700;font-size:18px;color:var(--green);'},rs(r.total))));
  });
  return wrap;
}

function blocked(title, text, link, linkText){
  const p = $('panel'); clear(p);
  $('tabs').style.display='none';
  p.append(h('div',{class:'center'}, h('h2',{},title), h('p',{class:'sub',style:'max-width:420px;'},text), link ? h('a',{class:'btn primary',href:link},linkText) : null));
}
(async function init(){
  $('logout').addEventListener('click', async ()=>{ await sb.auth.signOut(); window.location.href = 'auth.html'; });
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ window.location.href = 'auth.html?redirect=admin.html'; return; }
  me = user;
  const [{ data: rows, error }, { data: prof }] = await Promise.all([
    sb.from('staff_roles').select('role').eq('user_id', user.id),
    sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle()
  ]);
  myName = (prof && prof.full_name) || '';
  (rows||[]).forEach(r=>roles.add(r.role));
  if(error || !roles.size){ $('who').textContent = user.email || ''; blocked('No admin access','This page is only for Udaan Nepal staff. If you should have access, ask a super admin to give you a role.','courses','Back to my courses'); return; }
  $('who').textContent = (myName || user.email) + ' · ' + [...roles].map(r=>ROLE_LABEL[r]).join(', ');
  await refreshBadges(); drawTabs(); render();
})();
</script>
